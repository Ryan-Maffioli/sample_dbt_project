name: 'dbt_rmaffioli'
version: '1.0.0'
config-version: 2

profile: 'dbt_rmaffioli'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Global variables accessible by any model using {{ var('variable_name') }}
vars:
  pricing_compare_date_past: '2021-07-12'
  pricing_compare_date_recent: '2022-07-11'

models:
  dbt_rmaffioli:
    +persist_docs:
      relation: true
      columns: true

    staging:
      # Thin passthroughs: cheap and always fresh
      +materialized: view
      +schema: staging

    intermediate:
      # Expensive range/cross joins: compute once, read many
      +materialized: table
      +schema: intermediate

    marts:
      core:
        # Default for the core layer is table (for the heavy daily fact)
        +materialized: table
        +schema: core
        
        # Override the core default just for this lightweight dimension
        dim_listings:
          +materialized: view
          
      reporting:
        # BI-consumed aggregations
        +materialized: table
        +schema: reporting