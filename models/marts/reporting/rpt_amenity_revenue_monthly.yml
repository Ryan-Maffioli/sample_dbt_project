version: 2

models:
  - name: rpt_amenity_revenue_monthly
    description: >
      Monthly booked revenue and percent of month, split by point-in-time
      air conditioning. Grain: one row per month and has_ac.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - month
            - has_ac
    columns:
      - name: month
        description: First day of month for the aggregated period.
        tests:
          - not_null
      - name: has_ac
        description: Whether listings had air conditioning on the booked night.
        tests:
          - not_null
      - name: total_revenue
        description: Sum of nightly prices for reserved dates in the segment.
      - name: monthly_total_revenue
        description: Combined booked revenue across AC segments for the month.
      - name: pct_of_monthly_revenue
        description: Percent of monthly booked revenue from this segment.
