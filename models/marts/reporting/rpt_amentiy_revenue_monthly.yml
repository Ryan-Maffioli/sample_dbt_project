version: 2

models:
  - name: rpt_amenity_revenue_monthly
    description: "Monthly revenue aggregates and percentage segmentation by Air Conditioning status."
    columns:
      - name: month
        description: "First day of month for aggregated period."
        tests:
          - not_null
      - name: has_ac
        description: "Boolean segmentation flag for Air Conditioning presence."
        tests:
          - not_null
      - name: total_revenue
        description: "Total sum of booked revenue for segment during month."
      - name: monthly_total_revenue
        description: "Combined monthly baseline revenue across all properties."
      - name: pct_of_monthly_revenue
        description: "Percentage share of total monthly revenue generated by segment."