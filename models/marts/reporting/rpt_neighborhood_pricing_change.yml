version: 2

models:
  - name: rpt_neighborhood_pricing_change
    description: >
      Neighborhood average nightly prices for listings present on both
      pricing_compare_date_past and pricing_compare_date_recent
      (defaults 2021-07-12 and 2022-07-11). Grain: one row per neighborhood.
    columns:
      - name: neighborhood
        description: Neighborhood grouping from the past comparison date.
        tests:
          - unique
          - not_null
      - name: total_listings
        description: Count of listings present in the neighborhood on both comparison dates.
      - name: avg_price_past
        description: Average nightly price on pricing_compare_date_past.
      - name: avg_price_recent
        description: Average nightly price on pricing_compare_date_recent.
      - name: avg_price_increase
        description: Average recent price minus average past price for the same listing cohort.
      - name: avg_pct_price_change
        description: Percent change of the neighborhood average price between the two dates.
