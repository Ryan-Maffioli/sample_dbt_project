version: 2

models:
  - name: stg_calendar
    description: "Cleaned daily calendar grain table with standardized column names and boolean availability."
    columns:
      - name: listing_id
        description: "Foreign key referencing stg_listings."
        tests:
          - not_null
      - name: date
        description: "Date of listing availability or reservation snapshot."
        tests:
          - not_null
      - name: is_available
        description: "Boolean indicator designating whether listing is open for booking."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: reservation_id
        description: "Foreign key to reservation identifier. NULL if property is unreserved."
      - name: price
        description: "Nightly rate charged for specific calendar date."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: minimum_nights
        description: "Minimum consecutive nights required for booking."
      - name: maximum_nights
        description: "Maximum consecutive nights allowed for booking."