version: 2

models:
  - name: stg_amenities_changelog
    description: "Historical audit log capturing amenity configuration updates made by hosts."
    columns:
      - name: listing_id
        description: "Foreign key referencing stg_listings."
        tests:
          - not_null
      - name: change_ts
        description: "Timestamp when amenity updates took effect."
        tests:
          - not_null
      - name: amenities
        description: "JSON array of active amenities as of the change timestamp."