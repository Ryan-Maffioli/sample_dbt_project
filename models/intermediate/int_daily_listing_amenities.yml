version: 2

models:
  - name: int_daily_listing_amenities
    description: >
      Daily point-in-time amenity arrays. Changelog windows take precedence;
      otherwise the listing baseline array is used.

      Grain: one row per listing_id and date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - listing_id
            - date
    columns:
      - name: listing_id
        description: Composite key part 1. Property identifier.
        tests:
          - not_null
      - name: date
        description: Composite key part 2. Calendar date.
        tests:
          - not_null
      - name: amenities
        description: Effective ARRAY<STRING> on the date. Null when neither changelog nor listing baseline exists.
