version: 2

models:
  - name: int_amenities_changelog_spanned
    description: "SCD Type 2 transformation transforming changelog event timestamps into valid_from and valid_to date windows."
    columns:
      - name: listing_id
        description: "Foreign key referencing stg_listings."
        tests:
          - not_null
      - name: amenities
        description: "Parsed BigQuery ARRAY<STRING> of amenities active during window."
      - name: valid_from
        description: "Start date of amenity configuration window."
        tests:
          - not_null
      - name: valid_to
        description: "End date of amenity configuration window (defaults to 9999-12-31 for current state)."
        tests:
          - not_null