version: 2

sources:
  - name: source_calendar
    description: Raw daily calendar snapshot source data recording night-by-night availability and pricing.
    database: dbt-rmaffioli
    schema: source_calendar
    tables:
      - name: calendar
        description: Daily availability snapshots and actualized reservation records across all listings. Null listing_id rows and duplicate listing-date rows are cleaned in staging.
        columns:
          - name: listing_id
            description: Primary key joining to source_listings table. Nulls are dropped in staging.
          - name: date
            description: Snapshot date for specific calendar day.
            tests:
              - not_null
          - name: available
            description: Availability flag. May arrive as boolean or as Airbnb-style t/f strings; normalized in staging.
          - name: reservation_id
            description: Unique booking identifier assigned when calendar date is reserved. NULL if unreserved.
          - name: price
            description: Nightly rate charged for specific calendar date. May be numeric or a currency string; parsed in staging.
          - name: minimum_nights
            description: Minimum consecutive booking night requirement enforced on date.
          - name: maximum_nights
            description: Maximum consecutive booking night threshold permitted on date.
